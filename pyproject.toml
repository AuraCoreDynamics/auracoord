[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "auracoord"
version = "1.0.0"
description = "Sovereign Geodetic and Military Coordinate Conversion Package (DD, DMS, DDM, MGRS, UTM)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "AuraCore Dynamics", email = "engineering@auracoredynamics.com" }
]
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=7.0.0"
]

[project.scripts]
auracoord = "auracoord.gui:main"
auracoord-server = "auracoord.server:run_server"

[tool.setuptools.packages.find]
where = ["src"]
